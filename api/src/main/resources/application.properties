spring.application.name=api
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP_UTC

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true

spring.jackson.default-property-inclusion=non_null

spring.data.web.pageable.page-parameter=page
spring.data.web.pageable.size-parameter=size
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.mvc.problemdetails.enabled=false

logging.structured.format.console=ecs

app.jwt.secret=${JWT_SECRET}
app.email.from=${EMAIL_FROM:}
app.email.host=${EMAIL_HOST:}
app.email.port=${EMAIL_PORT:0}
app.email.username=${EMAIL_USERNAME:}
app.email.password=${EMAIL_PASSWORD:}
