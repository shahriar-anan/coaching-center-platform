spring.application.name=api
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP_UTC

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true

spring.jackson.default-property-inclusion=non_null
springdoc.paths-to-match=/api/v1/**

spring.data.web.pageable.page-parameter=page
spring.data.web.pageable.size-parameter=size
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.mvc.problemdetails.enabled=false

logging.structured.format.console=ecs

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutes=15
app.auth.refresh-token-days=30
app.auth.reset-code-minutes=10
app.auth.email-code-minutes=10
app.auth.activation-code-days=7
app.auth.code-max-attempts=5
app.auth.lockout.max-failures=5
app.auth.lockout.window-minutes=15
app.auth.dev-expose-email-codes=${DEV_EXPOSE_EMAIL_CODES:false}
app.auth.reset-response-floor-millis=400
app.email.from-address=${MAIL_FROM_ADDRESS:no-reply@symamlaw.com}
app.email.from-name=${MAIL_FROM_NAME:SYMAM LAW}
app.email.reply-to=${MAIL_REPLY_TO:}
app.email.host=${MAIL_HOST:}
app.email.port=${MAIL_PORT:587}
app.email.username=${MAIL_USERNAME:}
app.email.password=${MAIL_PASSWORD:${BREVO_API_KEY:}}
app.mail.sends-per-email-per-hour=3
app.mail.sends-per-ip-per-hour=10
app.mail.resend-cooldown-seconds=60
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
app.google.post-login-path=${GOOGLE_POST_LOGIN_PATH:/login/google}

app.bootstrap.phone=${MASTER_ADMIN_PHONE:}
app.bootstrap.email=${MASTER_ADMIN_EMAIL:}
app.bootstrap.name=${MASTER_ADMIN_NAME:}
app.bootstrap.password=${MASTER_ADMIN_PASSWORD:}

app.files.storage-dir=${FILE_STORAGE_DIR:}
app.files.material-max-bytes=${MATERIAL_MAX_BYTES:104857600}
app.files.exam-image-max-bytes=${EXAM_IMAGE_MAX_BYTES:15728640}

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

app.payment.bkash-number=${PAYMENT_BKASH_NUMBER:}
app.payment.nagad-number=${PAYMENT_NAGAD_NUMBER:}

# Landing page figures (GET /api/v1/public/site-stats). Students: the base plus student accounts created at or after
# students-counted-from. Mentors: the base plus activated instructors. STATS_STUDENTS_COUNTED_FROM is the release instant of
# the live figures; the placeholder below is only a stand-in until the owner sets the real value in the deploy record.
app.stats.students-base=${STATS_STUDENTS_BASE:874}
app.stats.mentors-base=${STATS_MENTORS_BASE:2}
app.stats.students-counted-from=${STATS_STUDENTS_COUNTED_FROM:2026-11-05T00:00:00Z}

app.sslcommerz.store-id=${SSLCZ_STORE_ID:}
app.sslcommerz.store-password=${SSLCZ_STORE_PASSWORD:}
app.sslcommerz.base-url=${SSLCZ_BASE_URL:}
app.sslcommerz.callback-base-url=${SSLCZ_CALLBACK_BASE_URL:}

# Staff salary job (staff pay plan, phase 5): writes the monthly SALARY lines and the salary reminders at 06:00 Dhaka every day.
# Set STAFF_PAY_JOBS_ENABLED=false to switch it off without a new build.
app.staff-pay.jobs-enabled=${STAFF_PAY_JOBS_ENABLED:true}

# Payout account numbers (staff pay plan, phase 9). PAYOUT_ENCRYPTION_KEY is 32 random bytes, base64 encoded. It has no default:
# without it, numbers are stored in the plain columns only. Set it before the first start that encrypts anything. Never commit it.
# PAYOUT_BACKFILL_ENABLED seals the numbers stored before the key existed; switch it off again after the verification passes.
app.payout.encryption-key=${PAYOUT_ENCRYPTION_KEY:}
app.payout.key-version=${PAYOUT_KEY_VERSION:1}
app.payout.backfill-enabled=${PAYOUT_BACKFILL_ENABLED:false}

# One-hour-before exam mail: off for now (client decision). Set EXAM_MAIL_HOUR_BEFORE_ENABLED=true to turn it on.
app.exam-mail.hour-before.enabled=${EXAM_MAIL_HOUR_BEFORE_ENABLED:false}
