spring.config.import=optional:file:.env[.properties]

app.auth.reset-response-floor-millis=0
app.mail.sends-per-email-per-hour=10000
app.mail.sends-per-ip-per-hour=10000
app.mail.resend-cooldown-seconds=0

app.cors.allowed-origins=${WEB_ORIGIN:http://localhost:3000}
app.seed.enabled=${SEED_ENABLED:false}
app.files.storage-dir=${FILE_STORAGE_DIR:var/files}
